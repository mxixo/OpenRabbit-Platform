<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>OpenRabbit — Deal Workspace</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.shell{max-width:1240px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:22px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#64748b}.title{font-size:30px;margin:5px 0 4px}.muted{color:#64748b}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}.card{background:white;border:1px solid #e5e7eb;border-radius:16px;padding:18px;box-shadow:0 1px 2px rgba(15,23,42,.04)}.span12{grid-column:span 12}.span8{grid-column:span 8}.span6{grid-column:span 6}.span4{grid-column:span 4}.span3{grid-column:span 3}.kpi{font-size:27px;font-weight:800;margin-top:8px}.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#64748b;font-weight:800}.scenario{border-left:4px solid #cbd5e1}.scenario h3{margin:6px 0}.decision{background:#0f172a;color:white}.decision .muted{color:#cbd5e1}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}button{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.primary{background:#fff;color:#0f172a}.secondary{background:#e2e8f0;color:#0f172a}.dark{background:#0f172a;color:white}.danger{background:#fee2e2;color:#991b1b}button:disabled{opacity:.45;cursor:not-allowed}.warning{background:#fff7ed;border-color:#fed7aa}.warning li{margin:8px 0}.timeline{padding:0;margin:0;list-style:none}.timeline li{padding:11px 0;border-bottom:1px solid #e5e7eb}.timeline li:last-child{border-bottom:0}.approval-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-top:1px solid #e5e7eb}.approval-row button{padding:7px 10px}.empty{padding:36px;text-align:center;color:#64748b}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar input,.form-grid input,.form-grid select{border:1px solid #cbd5e1;border-radius:9px;padding:9px 10px;background:white}.toolbar button{background:#0f172a;color:white}.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}.form-grid label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:800;color:#475569}.feedback{grid-column:1/-1;min-height:0;font-size:13px;font-weight:700}.feedback:not(:empty){padding:10px 12px;border-radius:10px;background:#e2e8f0}.feedback[data-type="success"]{background:#dcfce7;color:#166534}.feedback[data-type="error"]{background:#fee2e2;color:#991b1b}.version-table{width:100%;border-collapse:collapse;margin-top:10px}.version-table th,.version-table td{text-align:left;padding:10px;border-bottom:1px solid #e5e7eb;font-size:13px}.version-table th{color:#64748b;font-size:11px;text-transform:uppercase;letter-spacing:.06em}.setup{margin-bottom:18px}.setup h2{margin:0 0 6px}.advanced{margin-top:10px}.advanced summary{cursor:pointer;color:#64748b;font-weight:700;font-size:13px}@media(max-width:850px){.span8,.span6,.span4,.span3{grid-column:span 12}.top{flex-direction:column}.shell{padding:18px}.form-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="top">
      <div><div class="eyebrow">OpenRabbit / Real Estate</div><h1 class="title" id="dealTitle">Deal Workspace</h1><div class="muted" id="dealMeta">Decision-ready underwriting workspace</div></div>
      <div class="toolbar"><button id="newDealBtn">New deal</button><button id="loadExistingBtn">Load existing</button></div>
    </div>
    <section class="card setup" id="setupPanel">
      <h2>Start a deal</h2><p class="muted">Create a deal and run the first underwriting from one screen.</p>
      <div class="form-grid">
        <label>Property address<input id="newAddress" placeholder="2510 W Palo Verde Dr, Phoenix, AZ"></label>
        <label>Property type<select id="newPropertyType"><option value="multifamily">Multifamily</option><option value="commercial">Commercial</option><option value="retail">Retail</option><option value="office">Office</option><option value="industrial">Industrial</option></select></label>
        <label>Purchase price<input id="newPurchasePrice" type="number" min="1" placeholder="1600000"></label>
        <label>Annual gross income<input id="newIncome" type="number" min="1" placeholder="260000"></label>
        <label>Occupancy rate<input id="newOccupancy" type="number" min="0" max="1" step="0.01" value="0.9"></label>
        <label>Operating expense ratio<input id="newOpex" type="number" min="0" max="0.95" step="0.01" value="0.35"></label>
      </div>
      <div class="actions"><button class="dark" id="createDealBtn">Create deal & analyze</button></div>
      <details class="advanced"><summary>Advanced connection settings</summary><div class="form-grid"><label>Organization ID<input id="orgId" value="org-test"></label><label>Deal ID<input id="dealId" placeholder="Generated automatically"></label><label>Bearer token<input id="token" placeholder="Bearer token" type="password"></label></div></details>
    </section>
    <div id="app"><div class="card empty">Create a new deal or load an existing workspace.</div></div>
  </main>
<script src="./app.js"></script>
</body>
</html>
