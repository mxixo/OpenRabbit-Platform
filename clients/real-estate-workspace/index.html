<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>OpenRabbit — Deal Workspace</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.shell{max-width:1240px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:22px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#64748b}.title{font-size:30px;margin:5px 0 4px}.muted{color:#64748b}.badge{padding:7px 11px;border-radius:999px;background:#e2e8f0;font-size:12px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}.card{background:white;border:1px solid #e5e7eb;border-radius:16px;padding:18px;box-shadow:0 1px 2px rgba(15,23,42,.04)}.span12{grid-column:span 12}.span8{grid-column:span 8}.span4{grid-column:span 4}.span3{grid-column:span 3}.kpi{font-size:27px;font-weight:800;margin-top:8px}.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#64748b;font-weight:800}.scenario{border-left:4px solid #cbd5e1}.scenario h3{margin:6px 0}.decision{background:#0f172a;color:white}.decision .muted{color:#cbd5e1}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}button{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.primary{background:#fff;color:#0f172a}.secondary{background:#e2e8f0;color:#0f172a}button:disabled{opacity:.45;cursor:not-allowed}.warning{background:#fff7ed;border-color:#fed7aa}.warning li{margin:8px 0}.timeline{padding:0;margin:0;list-style:none}.timeline li{padding:11px 0;border-bottom:1px solid #e5e7eb}.timeline li:last-child{border-bottom:0}.approval-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-top:1px solid #e5e7eb}.approval-row button{padding:7px 10px}.empty{padding:36px;text-align:center;color:#64748b}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar input{border:1px solid #cbd5e1;border-radius:9px;padding:9px 10px;background:white}.toolbar button{background:#0f172a;color:white}@media(max-width:850px){.span8,.span4,.span3{grid-column:span 12}.top{flex-direction:column}.shell{padding:18px}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="top">
      <div><div class="eyebrow">OpenRabbit / Real Estate</div><h1 class="title" id="dealTitle">Deal Workspace</h1><div class="muted" id="dealMeta">Decision-ready underwriting workspace</div></div>
      <div class="toolbar"><input id="orgId" value="org-test" aria-label="Organization ID"><input id="dealId" value="deal-first-complete-loop" aria-label="Deal ID"><input id="token" placeholder="Bearer token" type="password" aria-label="Bearer token"><button id="loadBtn">Load deal</button></div>
    </div>
    <div id="app"><div class="card empty">Load a deal workspace from the OpenRabbit API.</div></div>
  </main>
<script src="./app.js"></script>
</body>
</html>
