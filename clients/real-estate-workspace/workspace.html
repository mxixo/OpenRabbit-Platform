<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>OpenRabbit — Adaptive Workspace</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#0f172a;background:#e9eef5}*{box-sizing:border-box}body{margin:0;min-height:100vh}.workspace-shell{min-height:100vh;display:grid;grid-template-rows:auto 1fr}.workspace-topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 20px;background:#0f172a;color:white}.brand{font-weight:900;font-size:20px}.brand small{display:block;font-size:11px;font-weight:700;color:#94a3b8;margin-top:2px}.today-strip{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.today-chip{background:#1e293b;border:1px solid #334155;border-radius:999px;padding:6px 10px;font-size:12px;color:#e2e8f0}.today-chip-button{cursor:pointer;font:inherit}.today-chip-button:hover{background:#334155}.workspace{padding:14px;display:grid;grid-template-columns:minmax(220px,.8fr) minmax(420px,2.2fr) minmax(250px,1fr);grid-template-rows:minmax(250px,1fr) minmax(180px,.58fr);gap:12px;min-height:0}.workspace-panel{background:white;border:1px solid #dbe2ea;border-radius:16px;box-shadow:0 2px 8px rgba(15,23,42,.06);min-width:0;min-height:0;overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .16s ease,transform .16s ease}.workspace-panel:hover{box-shadow:0 6px 18px rgba(15,23,42,.1)}.workspace-panel.focused{grid-column:2;grid-row:1 / span 2}.workspace-panel[data-slot="left"]{grid-column:1;grid-row:1}.workspace-panel[data-slot="right-top"]{grid-column:3;grid-row:1}.workspace-panel[data-slot="right-bottom"]{grid-column:3;grid-row:2}.workspace-panel[data-slot="bottom"]{grid-column:1;grid-row:2}.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:14px 15px;border-bottom:1px solid #e5e7eb;background:#fff}.panel-title{font-weight:900}.panel-sub{font-size:12px;color:#64748b;margin-top:2px}.focus-btn{border:0;background:#f1f5f9;color:#334155;border-radius:9px;padding:7px 9px;font-weight:800;cursor:pointer}.focused .focus-btn{background:#0f172a;color:white}.panel-body{padding:14px;overflow:auto;flex:1}.list{display:grid;gap:9px}.item{border:1px solid #e5e7eb;border-radius:11px;padding:10px;background:#fff}.item strong{display:block}.muted{color:#64748b}.small{font-size:12px}.calendar-grid{display:grid;grid-template-columns:74px 1fr;gap:0;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden}.calendar-grid div{padding:10px;border-bottom:1px solid #e5e7eb}.calendar-grid div:nth-last-child(-n+2){border-bottom:0}.time{font-size:12px;color:#64748b;background:#f8fafc}.agent{border-left:3px solid #94a3b8}.map-preview{height:100%;min-height:150px;border-radius:12px;background:linear-gradient(135deg,#dbeafe,#e2e8f0 45%,#dcfce7);display:grid;place-items:center;text-align:center;padding:16px}.metric-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{border:1px solid #e5e7eb;border-radius:11px;padding:10px}.metric b{display:block;font-size:20px;margin-top:5px}.social-card{border:1px solid #e5e7eb;border-radius:12px;padding:12px}.mode{display:inline-flex;border-radius:999px;padding:5px 8px;background:#fef3c7;color:#92400e;font-size:11px;font-weight:900}.composer{border:1px dashed #cbd5e1;border-radius:12px;padding:16px;background:#f8fafc}.composer input,.composer textarea,.composer select{border:1px solid #cbd5e1;border-radius:8px;padding:8px;background:#fff;color:#0f172a}.footer-note{padding:10px 14px;border-top:1px solid #e5e7eb;font-size:11px;color:#64748b;background:#f8fafc}
    .activity-drawer[hidden]{display:none}.activity-drawer{position:fixed;inset:0;z-index:30;background:rgba(15,23,42,.34);display:flex;justify-content:flex-end}.activity-sheet{width:min(620px,94vw);height:100%;background:#f8fafc;box-shadow:-14px 0 34px rgba(15,23,42,.2);display:flex;flex-direction:column}.activity-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px;background:#0f172a;color:#fff}.activity-head h2{margin:0;font-size:18px}.activity-head p{margin:4px 0 0;color:#94a3b8;font-size:12px}.activity-close{border:1px solid #475569;background:#1e293b;color:#fff;border-radius:9px;padding:7px 10px;cursor:pointer}.activity-list{padding:14px;display:grid;gap:10px;overflow:auto}.activity-row{display:grid;grid-template-columns:68px minmax(0,1fr) auto;gap:12px;align-items:start;background:#fff;border:1px solid #dbe2ea;border-radius:13px;padding:12px}.activity-time{font-size:12px;color:#64748b;padding-top:2px}.activity-title-row{display:flex;align-items:flex-start;gap:8px;justify-content:space-between}.activity-title-row strong{font-size:14px}.activity-meta{font-size:11px;color:#64748b;margin-top:5px;line-height:1.45}.activity-status{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.03em;border-radius:999px;padding:4px 6px;white-space:nowrap;background:#e2e8f0;color:#334155}.status-pending_approval{background:#fef3c7;color:#92400e}.status-approved{background:#dbeafe;color:#1d4ed8}.status-executing{background:#e0e7ff;color:#4338ca}.status-executed{background:#dcfce7;color:#166534}.status-failed{background:#fee2e2;color:#991b1b}.activity-controls{display:flex;gap:6px}.activity-btn{border:1px solid #cbd5e1;background:#fff;color:#334155;border-radius:8px;padding:7px 9px;font-weight:800;cursor:pointer}.activity-btn.primary{background:#0f172a;color:#fff;border-color:#0f172a}.activity-btn:disabled{opacity:.55;cursor:wait}.activity-empty{border:1px dashed #cbd5e1;border-radius:12px;padding:20px;background:#fff;display:grid;gap:5px}.activity-empty span{font-size:12px;color:#64748b}.activity-error{font-size:11px;color:#991b1b;margin-top:6px}
    @media(max-width:980px){.workspace{grid-template-columns:1fr;grid-template-rows:auto}.workspace-panel,.workspace-panel.focused,.workspace-panel[data-slot]{grid-column:1!important;grid-row:auto!important;min-height:220px}.workspace-panel.focused{order:-1;min-height:440px}.today-strip{display:none}}@media(max-width:600px){.workspace-topbar{padding:12px 14px}.workspace{padding:8px;gap:8px}.metric-row{grid-template-columns:1fr}.workspace-panel{border-radius:12px}.activity-row{grid-template-columns:1fr}.activity-time{font-weight:800}.activity-controls{justify-content:flex-start}}
  </style>
</head>
<body>
  <div class="workspace-shell">
    <header class="workspace-topbar">
      <div class="brand">OpenRabbit<small>Adaptive Real Estate Environment</small></div>
      <div class="today-strip" aria-label="Today summary">
        <span class="today-chip" id="todayApprovals">Approvals —</span>
        <button class="today-chip today-chip-button" id="activityTrigger" type="button">Agent actions —</button>
        <span class="today-chip" id="todaySchedule">Scheduled —</span>
      </div>
    </header>

    <main class="workspace" id="adaptiveWorkspace" aria-label="Adaptive five-window workspace"></main>
  </div>

  <aside class="activity-drawer" id="activityDrawer" hidden aria-hidden="true" aria-label="OpenRabbit agent activity">
    <section class="activity-sheet">
      <header class="activity-head">
        <div><h2>Agent activity</h2><p id="activityState">Loading activity…</p></div>
        <button class="activity-close" id="activityClose" type="button">Close</button>
      </header>
      <div class="activity-list" id="activityList"></div>
    </section>
  </aside>

  <script src="./workspace.js"></script>
  <script src="./crm-ui.js"></script>
  <script src="./email-ui.js"></script>
  <script src="./map-ui.js"></script>
  <script src="./social-ui.js"></script>
  <script src="./activity-ui.js"></script>
</body>
</html>
