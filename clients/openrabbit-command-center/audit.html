<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenRabbit Control Log</title><link rel="stylesheet" href="./styles.css"><style>body{margin:0;background:#07100f;color:#eaf3ef;font:14px Inter,system-ui,sans-serif}.wrap{max-width:1200px;margin:auto;padding:26px}.top{display:flex;justify-content:space-between;align-items:center}.top a{color:#69deb3;text-decoration:none}.hero,.panel{background:#0d1917;border:1px solid #24332f;border-radius:14px;padding:18px}.hero{margin:18px 0}.hero small{color:#5de0b1}.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}.item{background:#091411;border:1px solid #203a32;border-radius:10px;padding:13px;margin:8px 0}.item header{display:flex;justify-content:space-between}.item p,.item small{color:#82978f}.item button{border:1px solid #315548;background:#142621;color:#a9ddcb;padding:7px 10px;border-radius:7px;margin-right:6px}.item button.approve{background:#46d6a1;color:#052018;border:0}.status{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#f0c16b}.status.approved{color:#5de0b1}.status.rejected{color:#e98a8a}pre{white-space:pre-wrap;color:#80978f;font:11px ui-monospace,monospace}@media(max-width:850px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><div><b>OpenRabbit</b> · Control Log</div><div><a href="./connections.html">Connections</a> · <a href="./index.html">Command Center</a></div></div><section class="hero"><small>HUMAN-IN-THE-LOOP CONTROL</small><h1>Approvals & Audit</h1><p>Review what OpenRabbit proposed, decide consequential actions, and see the trace of agent and integration activity.</p></section><main class="grid"><section class="panel"><h2>Approval Queue</h2><div id="approvals">Loading…</div></section><section class="panel"><h2>Audit Stream</h2><div id="audit">Loading…</div></section></main></div><script>const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function decide(id,decision){await fetch('/api/approvals/'+encodeURIComponent(id)+'/'+decision,{method:'POST'});load()}async function load(){const [a,e]=await Promise.all([fetch('/api/approvals').then(r=>r.json()),fetch('/api/audit').then(r=>r.json())]);const approvals=document.getElementById('approvals');approvals.innerHTML=(a.approvals||[]).map(x=>`<article class="item"><header><b>${esc(x.summary)}</b><span class="status ${esc(x.status)}">${esc(x.status)}</span></header><small>${esc(x.type)} · ${esc(x.createdAt)}</small><p>${esc(x.payload?.message||'')}</p>${x.status==='pending'?`<button class="approve" onclick="decide('${x.id}','approve')">Approve</button><button onclick="decide('${x.id}','reject')">Reject</button>`:''}<details><summary>Context</summary><pre>${esc(JSON.stringify(x.context,null,2))}</pre></details></article>`).join('')||'<p>No approvals yet.</p>';document.getElementById('audit').innerHTML=(e.events||[]).map(x=>`<article class="item"><b>${esc(x.type)}</b><small>${esc(x.timestamp||'')}</small><pre>${esc(JSON.stringify(x,null,2))}</pre></article>`).join('')||'<p>No audit events yet.</p>'}load();setInterval(load,5000);</script></body></html>
