services:
  connection-gateway:
    build:
      context: ../..
      dockerfile: services/connection-gateway/Dockerfile
    restart: unless-stopped
    environment:
      OPENRABBIT_CONNECTION_GATEWAY_HOST: 0.0.0.0
      OPENRABBIT_CONNECTION_GATEWAY_PORT: 8790
      OPENRABBIT_CONNECTION_GATEWAY_PUBLIC_URL: ${OPENRABBIT_CONNECTION_GATEWAY_PUBLIC_URL:-}
      OPENRABBIT_GATEWAY_APP_TOKEN: ${OPENRABBIT_GATEWAY_APP_TOKEN:-}
      OPENRABBIT_TOKEN_ENCRYPTION_KEY: ${OPENRABBIT_TOKEN_ENCRYPTION_KEY:-}
      OPENRABBIT_GATEWAY_DATA_DIR: /data
      OPENRABBIT_GATEWAY_CORS_ORIGIN: ${OPENRABBIT_GATEWAY_CORS_ORIGIN:-*}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      HUBSPOT_OAUTH_CLIENT_ID: ${HUBSPOT_OAUTH_CLIENT_ID:-}
      HUBSPOT_OAUTH_CLIENT_SECRET: ${HUBSPOT_OAUTH_CLIENT_SECRET:-}
      HUBSPOT_OAUTH_SCOPES: ${HUBSPOT_OAUTH_SCOPES:-crm.objects.contacts.read crm.objects.companies.read crm.objects.deals.read}
      GOOGLE_MAPS_BROWSER_KEY: ${GOOGLE_MAPS_BROWSER_KEY:-}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v23.0}
      META_OAUTH_SCOPES: ${META_OAUTH_SCOPES:-public_profile,pages_show_list,pages_read_engagement,instagram_basic,instagram_manage_insights}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      LINKEDIN_OAUTH_SCOPES: ${LINKEDIN_OAUTH_SCOPES:-openid profile email}
      TIKTOK_CLIENT_KEY: ${TIKTOK_CLIENT_KEY:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
      TIKTOK_OAUTH_SCOPES: ${TIKTOK_OAUTH_SCOPES:-user.info.basic,video.list}
    expose:
      - "8790"
    volumes:
      - openrabbit_gateway_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8790/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  gateway-edge:
    image: caddy:2.9-alpine
    restart: unless-stopped
    depends_on:
      connection-gateway:
        condition: service_healthy
    environment:
      OPENRABBIT_GATEWAY_SITE: ${OPENRABBIT_GATEWAY_SITE:-http://0.0.0.0}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - openrabbit_caddy_data:/data
      - openrabbit_caddy_config:/config

volumes:
  openrabbit_gateway_data:
  openrabbit_caddy_data:
  openrabbit_caddy_config:
