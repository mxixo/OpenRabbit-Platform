name: Deploy OpenRabbit to Hostinger VPS

on:
  push:
    branches: [ main ]
    paths:
      - 'services/connection-gateway/**'
      - 'deploy/vps/**'
      - '.github/workflows/deploy-hostinger-vps.yml'
  workflow_dispatch:

concurrency:
  group: openrabbit-hostinger-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out OpenRabbit
        uses: actions/checkout@v5

      - name: Deploy to Hostinger VPS
        uses: hostinger/deploy-on-vps@v2
        with:
          api-key: ${{ secrets.HOSTINGER_API_KEY }}
          virtual-machine: ${{ vars.HOSTINGER_VM_ID }}
          project-name: openrabbit
          docker-compose-path: deploy/vps/docker-compose.yml
          environment-variables: |
            OPENRABBIT_CONNECTION_GATEWAY_PUBLIC_URL=${{ secrets.OPENRABBIT_CONNECTION_GATEWAY_PUBLIC_URL }}
            OPENRABBIT_GATEWAY_APP_TOKEN=${{ secrets.OPENRABBIT_GATEWAY_APP_TOKEN }}
            OPENRABBIT_TOKEN_ENCRYPTION_KEY=${{ secrets.OPENRABBIT_TOKEN_ENCRYPTION_KEY }}
            OPENRABBIT_GATEWAY_CORS_ORIGIN=${{ secrets.OPENRABBIT_GATEWAY_CORS_ORIGIN }}
            GOOGLE_OAUTH_CLIENT_ID=${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
            GOOGLE_OAUTH_CLIENT_SECRET=${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
            HUBSPOT_OAUTH_CLIENT_ID=${{ secrets.HUBSPOT_OAUTH_CLIENT_ID }}
            HUBSPOT_OAUTH_CLIENT_SECRET=${{ secrets.HUBSPOT_OAUTH_CLIENT_SECRET }}
            GOOGLE_MAPS_BROWSER_KEY=${{ secrets.GOOGLE_MAPS_BROWSER_KEY }}
