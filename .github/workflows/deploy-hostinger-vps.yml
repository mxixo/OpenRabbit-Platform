name: Deploy OpenRabbit to Hostinger VPS

on:
  push:
    branches: [ main ]
    paths:
      - 'services/connection-gateway/**'
      - 'deploy/vps/**'
      - '.github/workflows/deploy-hostinger-vps.yml'
  workflow_dispatch:

concurrency:
  group: openrabbit-hostinger-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out OpenRabbit
        uses: actions/checkout@v5

      - name: Validate production compose
        env:
          OPENRABBIT_GATEWAY_SITE: http://localhost
          OPENRABBIT_CONNECTION_GATEWAY_PUBLIC_URL: http://localhost
        run: docker compose -f deploy/vps/docker-compose.yml config --quiet

      - name: Deploy to Hostinger VPS
        uses: hostinger/deploy-on-vps@v2
        with:
          api-key: ${{ secrets.HOSTINGER_API_KEY }}
          virtual-machine: ${{ vars.HOSTINGER_VM_ID }}
          project-name: openrabbit
          docker-compose-path: deploy/vps/docker-compose.yml
          environment-variables: |
            OPENRABBIT_GATEWAY_SITE=${{ vars.OPENRABBIT_GATEWAY_SITE }}
            OPENRABBIT_CONNECTION_GATEWAY_PUBLIC_URL=${{ vars.OPENRABBIT_CONNECTION_GATEWAY_URL }}
            OPENRABBIT_GATEWAY_APP_TOKEN=${{ secrets.OPENRABBIT_GATEWAY_APP_TOKEN }}
            OPENRABBIT_TOKEN_ENCRYPTION_KEY=${{ secrets.OPENRABBIT_TOKEN_ENCRYPTION_KEY }}
            OPENRABBIT_GATEWAY_CORS_ORIGIN=${{ vars.OPENRABBIT_GATEWAY_CORS_ORIGIN }}
            GOOGLE_OAUTH_CLIENT_ID=${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
            GOOGLE_OAUTH_CLIENT_SECRET=${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
            HUBSPOT_OAUTH_CLIENT_ID=${{ secrets.HUBSPOT_OAUTH_CLIENT_ID }}
            HUBSPOT_OAUTH_CLIENT_SECRET=${{ secrets.HUBSPOT_OAUTH_CLIENT_SECRET }}
            GOOGLE_MAPS_BROWSER_KEY=${{ secrets.GOOGLE_MAPS_BROWSER_KEY }}

      - name: Verify public gateway health
        if: ${{ vars.OPENRABBIT_CONNECTION_GATEWAY_URL != '' }}
        env:
          OPENRABBIT_GATEWAY_URL: ${{ vars.OPENRABBIT_CONNECTION_GATEWAY_URL }}
        run: |
          for attempt in 1 2 3 4 5 6 7 8 9; do
            if curl --fail --silent --show-error --max-time 10 "$OPENRABBIT_GATEWAY_URL/health"; then
              echo "OpenRabbit gateway is healthy and publicly reachable."
              exit 0
            fi
            echo "Gateway not ready yet (attempt $attempt/9)."
            sleep 10
          done
          echo "OpenRabbit gateway health check failed."
          exit 1
