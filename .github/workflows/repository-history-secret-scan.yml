name: Repository history secret scan

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-history-secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-history-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Resolve history comparison boundary
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "HISTORY_SCAN_MODE=compare" >> "$GITHUB_ENV"
            echo "HISTORY_BASE_SHA=$PR_BASE_SHA" >> "$GITHUB_ENV"
            echo "HISTORY_HEAD_SHA=$PR_HEAD_SHA" >> "$GITHUB_ENV"
          elif [ "$EVENT_NAME" = "push" ] && [ -n "$PUSH_BEFORE_SHA" ] && [ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            echo "HISTORY_SCAN_MODE=compare" >> "$GITHUB_ENV"
            echo "HISTORY_BASE_SHA=$PUSH_BEFORE_SHA" >> "$GITHUB_ENV"
            echo "HISTORY_HEAD_SHA=$PUSH_HEAD_SHA" >> "$GITHUB_ENV"
          else
            echo "HISTORY_SCAN_MODE=full" >> "$GITHUB_ENV"
            echo "HISTORY_BASE_SHA=" >> "$GITHUB_ENV"
            echo "HISTORY_HEAD_SHA=$PUSH_HEAD_SHA" >> "$GITHUB_ENV"
          fi

      - name: Scan reachable history at comparison boundary
        id: scan
        shell: bash
        run: |
          set -u
          rm -rf artifacts/repository-history-secret-scan
          mkdir -p artifacts/repository-history-secret-scan

          set +e
          node scripts/repository-history-secret-scan.js \
            --rev "$HISTORY_HEAD_SHA" \
            --output artifacts/repository-history-secret-scan/head-report.json
          head_status=$?

          base_status=0
          if [ "$HISTORY_SCAN_MODE" = "compare" ]; then
            node scripts/repository-history-secret-scan.js \
              --rev "$HISTORY_BASE_SHA" \
              --output artifacts/repository-history-secret-scan/base-report.json
            base_status=$?
          fi
          set -e

          scan_error=false
          if [ "$head_status" -eq 2 ] || [ "$base_status" -eq 2 ]; then
            scan_error=true
          fi
          echo "scan_error=$scan_error" >> "$GITHUB_OUTPUT"

      - name: Compare findings without publishing retrieval pointers
        id: compare
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const dir = 'artifacts/repository-history-secret-scan';
          const headPath = `${dir}/head-report.json`;
          const basePath = `${dir}/base-report.json`;
          const summaryPath = `${dir}/summary.json`;
          const mode = process.env.HISTORY_SCAN_MODE || 'full';

          if (!fs.existsSync(headPath)) {
            fs.writeFileSync(summaryPath, `${JSON.stringify({
              protocol: 'openrabbit_repository_history_secret_scan_ci_v1',
              mode,
              passed: false,
              scan_error: true,
              reason: 'head_report_missing',
              secret_values_in_summary: false,
              finding_paths_in_summary: false,
              finding_blob_ids_in_summary: false,
              finding_line_numbers_in_summary: false,
            }, null, 2)}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'head_finding_count=0\nnew_finding_count=0\ncomparison_error=true\n');
            process.exit(0);
          }

          const head = JSON.parse(fs.readFileSync(headPath, 'utf8'));
          const base = mode === 'compare' && fs.existsSync(basePath)
            ? JSON.parse(fs.readFileSync(basePath, 'utf8'))
            : null;

          function fingerprint(finding) {
            return JSON.stringify([
              String(finding.rule_id || ''),
              String(finding.blob_oid || ''),
              Number(finding.line || 0),
              String(finding.variable || ''),
            ]);
          }

          const baseFingerprints = new Set((base?.findings || []).map(fingerprint));
          const newFindings = mode === 'compare'
            ? (head.findings || []).filter((finding) => !baseFingerprints.has(fingerprint(finding)))
            : (head.findings || []);

          const newRuleCounts = {};
          for (const finding of newFindings) {
            const rule = String(finding.rule_id || 'unknown');
            newRuleCounts[rule] = (newRuleCounts[rule] || 0) + 1;
          }

          const summary = {
            protocol: 'openrabbit_repository_history_secret_scan_ci_v1',
            mode,
            head_revision: head.history_revision_oid || head.repository_head,
            base_revision: base ? (base.history_revision_oid || base.repository_head) : null,
            scanner_sha256: head.scanner_sha256,
            head_finding_count: Number(head.finding_count || 0),
            base_finding_count: base ? Number(base.finding_count || 0) : null,
            new_finding_count: newFindings.length,
            new_rule_counts: newRuleCounts,
            head_scanned_blob_count: Number(head.scanned_blob_count || 0),
            base_scanned_blob_count: base ? Number(base.scanned_blob_count || 0) : null,
            release_requires_zero_total_findings: true,
            comparison_guard_passed: mode === 'compare' ? newFindings.length === 0 : head.finding_count === 0,
            secret_values_in_summary: false,
            finding_paths_in_summary: false,
            finding_blob_ids_in_summary: false,
            finding_line_numbers_in_summary: false,
            detailed_classification_location: 'trusted_local_clone_only',
          };
          fs.writeFileSync(summaryPath, `${JSON.stringify(summary, null, 2)}\n`, { encoding: 'utf8', flag: 'wx' });

          const lines = [
            '### Repository history secret scan',
            '',
            `- Mode: ${mode}`,
            `- Findings reachable from head: ${summary.head_finding_count}`,
            ...(mode === 'compare' ? [
              `- Findings reachable from base: ${summary.base_finding_count}`,
              `- Newly reachable findings: ${summary.new_finding_count}`,
            ] : []),
            `- Commercial release requires zero total findings: yes`,
            '',
            '| Newly reachable rule | Count |',
            '| --- | ---: |',
            ...Object.entries(newRuleCounts)
              .sort(([a], [b]) => a.localeCompare(b))
              .map(([rule, count]) => `| ${rule} | ${count} |`),
            '',
            'Secret values, historical paths, blob IDs, and line numbers are intentionally excluded from CI logs and retained artifacts.',
            mode === 'compare'
              ? 'CI ratchets against the reachable base history so unresolved legacy findings cannot grow while trusted-local classification/remediation proceeds.'
              : 'Full audit mode remains fail-closed until all reachable findings are classified and remediated.',
            '',
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join('\n')}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `head_finding_count=${summary.head_finding_count}\nnew_finding_count=${summary.new_finding_count}\ncomparison_error=false\n`);
          NODE

      - name: Remove detailed finding locations from runner workspace
        if: always()
        shell: bash
        run: |
          rm -f artifacts/repository-history-secret-scan/head-report.json
          rm -f artifacts/repository-history-secret-scan/base-report.json

      - name: Upload low-sensitivity scan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-history-secret-scan-${{ github.sha }}
          path: artifacts/repository-history-secret-scan/summary.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce history guard
        if: always()
        shell: bash
        env:
          SCAN_ERROR: ${{ steps.scan.outputs.scan_error }}
          COMPARISON_ERROR: ${{ steps.compare.outputs.comparison_error }}
          HEAD_FINDING_COUNT: ${{ steps.compare.outputs.head_finding_count }}
          NEW_FINDING_COUNT: ${{ steps.compare.outputs.new_finding_count }}
        run: |
          set -euo pipefail
          if [ "$SCAN_ERROR" = "true" ] || [ "$COMPARISON_ERROR" = "true" ]; then
            echo "Repository history scan could not establish its comparison boundary; failing closed."
            exit 1
          fi
          if [ "$HISTORY_SCAN_MODE" = "compare" ]; then
            if [ "$NEW_FINDING_COUNT" != "0" ]; then
              echo "New credential-like material became reachable from Git history. Review in a trusted local clone before merge."
              exit 1
            fi
            echo "No newly reachable credential-like findings. Legacy findings remain a commercial-release blocker until fully remediated."
          else
            if [ "$HEAD_FINDING_COUNT" != "0" ]; then
              echo "Full history audit is not clean. Classify findings in a trusted local clone, rotate any real credentials, then remediate history."
              exit 1
            fi
            echo "Full reachable history is clean under the configured detector."
          fi
