name: OpenRabbit Repository Snapshot

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  create-snapshot:
    name: Create repository snapshot
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
  

      - name: Create snapshot archive
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          SNAPSHOT="OpenRabbit-Platform-${SHORT_SHA}.tar.gz"
          git archive --format=tar.gz --output="$SNAPSHOT" HEAD
          echo "SNAPSHOT=$SNAPSHOT" >> "$GITHUB_ENV"

      - name: Upload snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenRabbit-Platform-${{ github.sha }}
          path: ${{ env.SNAPSHOT }}
          retention-days: 30
          if-no-files-found: error
